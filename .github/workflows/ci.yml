#
# Pull request and main CI. The jobs (Arch, Lint, Nix) are the shared C++ CI
# of the workspace repository (.github/workflows/cpp-ci.yml), which says what
# each one does. This file passes only what differs here.
#
# phosphor-libs and phosphor-shell-libs come from the commits
# cmake/LambentDependencies.cmake pins, built with their tests on, and the
# decoration packs test_shell_chrome resolves against from the
# phosphor-surface-packs commit it pins.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    uses: phosphor-works/workspace/.github/workflows/cpp-ci.yml@main
    with:
      pin-file: cmake/LambentDependencies.cmake
      nix-timeout: 60
      nix-verify: |
        test -x result/bin/lambent || { echo "::error::the package installed no lambent binary"; exit 1; }
        test -e result/share/applications/org.phosphor_works.Lambent.desktop || { echo "::error::the package installed no .desktop file"; exit 1; }
